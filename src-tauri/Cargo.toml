[package]
name = "openridr"
version = "0.3.0-alpha.11"
description = "OpenRidr desktop shell"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openridr-host = { path = "../crates/host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Approved dependency (ticket 10): one process per app identifier, argv forwarded to it.
tauri-plugin-single-instance = "2.5.5"
# Approved dependency (issue #55): signed in-app updates from the release channel.
tauri-plugin-updater = "2.14.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Approved dependency (issue #319, Helder 2026-11-09): the XDG portal file chooser answers on the
# connection that called it, so a one-shot `gdbus` loses the reply. Already transitive through
# tauri-plugin-single-instance; this makes it direct so the shell can own the dialog.
zbus = "5.19.0"
