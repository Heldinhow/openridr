[package]
name = "openridr"
version = "0.3.0-alpha.5"
description = "OpenRidr desktop shell"
edition = "2021"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openridr-host = { path = "../crates/host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Approved dependency (ticket 10): one process per app identifier, argv forwarded to it.
tauri-plugin-single-instance = "2.5.5"
