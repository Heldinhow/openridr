name: Bug report
description: Report a reproducible problem in OpenRidr
title: "fix: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: OpenRidr version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: macOS version and architecture
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: .NET SDK version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Remove secrets and private paths before sharing.
