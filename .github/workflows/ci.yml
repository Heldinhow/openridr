name: ci

# What runs on every pull request to main. The app targets macOS arm64, so the Rust job runs on
# macos-15; the TypeScript job needs no macOS and runs on ubuntu to keep the queue short.
#
# The names of the `ci` and `security` jobs are a contract with .github/rulesets/main.json: renaming
# either of them (or removing the job) without updating the ruleset silently removes the required
# check.
on:
  pull_request:
    branches: [main]
    # `edited` so a fixed PR title is re-linted; the default types do not include it.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  # Lets a branch exercise this workflow before it becomes a required check.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript (tsc + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test:unit

  rust:
    name: Rust (fmt, clippy, host tests)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # The fixture output is parsed in English; a translated runner would break the assertions.
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The channel, rustfmt and clippy come from rust-toolchain.toml: no toolchain action to pin and
      # no second place where the Rust version lives. The runner image already ships rustup.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          # src-tauri is a separate workspace; it formats with its own manifest.
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # src-tauri is left out of this job on purpose: it is a separate workspace that builds the whole
      # Tauri stack, so it has its own job (`rust-tauri`) running in parallel.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The fixtures pin SDK 8.0.408 in their global.json with rollForward: disable, and the runner
      # image does not ship that exact version.
      - name: Set up the fixture .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.408"

      # The first `dotnet` run on a clean machine creates ~/.nuget/NuGet/NuGet.Config and fills the
      # package cache. Several host tests restore at the same time, and on a fresh runner the race left
      # one of them with an empty source list (NU1100). One restore first, with a loud failure if the
      # network or the SDK is missing, instead of a flaky test result.
      - name: Warm the NuGet configuration
        run: dotnet restore fixtures/OrderDesk/OrderDesk.sln

      - name: Host tests
        run: cargo test -p openridr-host

  rust-tauri:
    # src-tauri is its own workspace, so `cargo clippy --workspace` and `cargo test -p openridr-host`
    # never reached it: its 6 tests ran on nobody's runner. It runs in parallel with the Rust job so the
    # pull request wall time does not change, and it is informative for now: `continue-on-error` makes
    # the job result `success` (actions/runner#1161: the UI still shows the failure), so the `ci`
    # aggregator stays green and no ruleset or required check changes.
    #
    # Promotion (issue #219): 5 consecutive green runs, at least one with a cold cache, a stable
    # duration under 5 minutes and no flake. Promoting is removing `continue-on-error` in its own pull
    # request; the `ci` aggregator is the only required check, so the job then blocks without touching
    # any repository setting.
    name: Tauri (clippy + tests)
    runs-on: macos-15
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same source of truth as the Rust job: the channel and the components come from
      # rust-toolchain.toml, so there is no second place where the Rust version lives.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy

      # The workspace is src-tauri, not the repository root: rust-cache has to be told where the
      # manifest and the `target` directory are.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      # tauri-build validates the bundle resources, and both vendor directories are gitignored, so a
      # clean checkout fails with `resource path 'resources/csharp-ls' doesn't exist`. CI does not run
      # the vendor scripts and does not need their content here: only the existence of the path matters.
      - name: Create the empty resource directories
        run: mkdir -p src-tauri/resources/csharp-ls src-tauri/resources/dotnet

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  governance:
    name: Governance (workflows, PR title, PR body)
    # Only a pull request has a title and a body to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflow files
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"
          pyflakes: false

      # Offline audits only: no GitHub token, no network, deterministic result for the same YAML.
      # `min-severity: low` keeps the job honest without failing on the informational
      # `template-injection` findings that expand our own step outputs inside a `run:` block (the
      # release workflow: `steps.release.outputs.*` comes from scripts/release-macos.sh). Anything
      # low and above blocks, including `${{ github.event.* }}` in a run block.
      - name: Audit the workflow files
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          advanced-security: false
          online-audits: false
          min-severity: "low"

      - name: Check the PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            test
            perf
            build
            revert
          requireScope: false

      - name: Self-check the PR body gate
        run: sh scripts/ci-pr-body-selfcheck.sh

      - name: Check the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          body="$RUNNER_TEMP/pull-request-body.md"
          printf '%s' "$PR_BODY" >"$body"
          sh scripts/ci-pr-body.sh "$body" "$PR_AUTHOR"

  security:
    # Deterministic checks only: gitleaks. The high-severity review by an LLM needs a credential
    # (see issue "security review on every PR") and is not wired here.
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The hit is looked for in the whole history, not only in the last commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # The action comments on the PR only with this token, which a fork does not get; the failure
          # is in the step log and the job summary either way.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  risk:
    # What a change can break, decided by the paths it touches (scripts/ci-risk-tier.sh), never by who
    # wrote it: documentation, tests and stylesheets arm auto-merge; CI, release, signing, the trust
    # model and dependency changes need the maintainer's approval of the current revision. PR-only, and
    # inside the `ci` aggregator, so the main ruleset does not change.
    name: Risk tier and maintainer approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the risk label and the auto-merge call; the gate itself only reads
      issues: write # the same two calls: a pull request label is served by the issues API
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tier is a diff between the base branch and the pull request head: both sides must be in
          # the clone, with the history that makes `base...head` the pull request's own changes.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Take the classifier and the gate from the base revision
        id: trusted
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The classifier and the gate decide whether this pull request may merge, so they must not come
          # from the pull request: a change to the risk scripts would otherwise classify itself as low or
          # approve itself, which is exactly the path this gate exists to protect. They are read from the
          # base revision and executed from there, with the workspace as the git repository.
          #
          # When the base revision has no copy (the pull request that introduces them) the job does **not**
          # fall back to the pull request's script: it uses the fixed policy written in this file instead
          # (tier forced to high, inline approval check). A warning is not a gate.
          # --- trusted blob check (tested by tests/shell/ci-workflow-bootstrap.test.sh) ---
          # A blob is usable only when it is a regular file (not a symlink, not a tree) and is not empty:
          # `git show` of an empty blob succeeds, and `sh` on an empty file exits 0, which would turn a
          # missing policy into a passing one.
          trusted_blob() { # <rev> <path> <destination>
            entry=$(git ls-tree "$1" -- "$2" 2>/dev/null) || return 1
            mode=$(printf '%s' "$entry" | awk '{print $1}')
            case "$mode" in
              100644 | 100755) ;;
              *) return 1 ;;
            esac
            size=$(git cat-file -s "$1:$2" 2>/dev/null) || return 1
            [ "${size:-0}" -gt 0 ] || return 1
            git show "$1:$2" >"$3" 2>/dev/null || return 1
            [ -s "$3" ] || return 1
            return 0
          }
          # --- end trusted blob check ---

          mkdir -p "$RUNNER_TEMP/trusted/scripts"
          bootstrap=0
          for name in ci-risk-tier.sh ci-risk-gate.sh; do
            if trusted_blob "origin/$BASE_REF" "scripts/$name" "$RUNNER_TEMP/trusted/scripts/$name"; then
              echo "scripts/$name: from origin/$BASE_REF"
            else
              rm -f "$RUNNER_TEMP/trusted/scripts/$name"
              bootstrap=1
              echo "::warning::origin/$BASE_REF has no usable scripts/$name: this run uses the fixed bootstrap policy in the workflow file, never the copy from this pull request"
            fi
          done
          echo "bootstrap=$bootstrap" >>"$GITHUB_OUTPUT"
          if [ "$bootstrap" = 1 ]; then
            {
              echo
              echo '**Bootstrap**: the base revision has no risk classifier or gate yet. The tier is forced to high and the approval is checked by the fixed rule in the workflow file; no script from this pull request was executed.'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Compute the risk tier
        id: tier
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fail closed: a tier that cannot be computed is the highest one, never the lowest.
          classifier="$RUNNER_TEMP/trusted/scripts/ci-risk-tier.sh"
          if [ ! -s "$classifier" ]; then
            # Bootstrap: the base revision has no classifier, and the pull request's copy is not trusted.
            tier=high
            echo 'the base revision has no risk classifier; failing closed to high' >"$RUNNER_TEMP/risk-reasons.txt"
            echo '::warning::the base revision has no risk classifier; this pull request is high risk'
          elif tier=$(sh "$classifier" "origin/$BASE_REF" "$HEAD_SHA" 2>"$RUNNER_TEMP/risk-reasons.txt"); then
            :
          else
            tier=high
            echo 'could not compute the risk tier; failing closed to high' >>"$RUNNER_TEMP/risk-reasons.txt"
            echo '::error::could not compute the risk tier; failing closed to high'
          fi
          echo "tier=$tier" >>"$GITHUB_OUTPUT"
          {
            printf '### Risk tier: %s\n' "$tier"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/risk-reasons.txt"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Label the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          # The labels are created here, idempotently (`--force` updates an existing one), so the first
          # pull request after this workflow lands is labelled with no manual setup step.
          case "$TIER" in
            low) colour=0e8a16 ;;
            medium) colour=fbca04 ;;
            *) colour=b60205 ;;
          esac
          # The label is a signal for humans; failing to write it (a fork pull request gets a read-only
          # token) must not block a merge.
          gh label create "risk:$TIER" --repo "$REPO" --color "$colour" --force \
            --description "Risk tier computed from the paths this pull request touches" \
            || echo "::warning::could not create the label risk:$TIER; the tier above is still authoritative"
          for stale in low medium high; do
            if [ "risk:$stale" = "risk:$TIER" ]; then continue; fi
            # Deleting a label the pull request does not carry answers 404, which is not an error here.
            gh api --method DELETE "repos/$REPO/issues/$PR_NUMBER/labels/risk:$stale" >/dev/null 2>&1 || true
          done
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=risk:$TIER" >/dev/null \
            || echo "::warning::could not label the pull request risk:$TIER"

      - name: Require the maintainer for a high-risk pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TIER: ${{ steps.tier.outputs.tier }}
          # The approval has to name this commit, so the gate needs the head it is gating.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gate="$RUNNER_TEMP/trusted/scripts/ci-risk-gate.sh"
          if [ -s "$gate" ]; then
            sh "$gate"
            exit $?
          fi
          # --- bootstrap gate rule (tested by tests/shell/ci-workflow-bootstrap.test.sh) ---
          # The base revision has no usable gate script yet. The rule below is fixed in this file and is the
          # same one scripts/ci-risk-gate.sh implements — the latest decision per reviewer, a review
          # APPROVED on this exact commit, from someone with write access, or a pull request authored by
          # the repository owner (GitHub refuses a self-approval, so a single-maintainer repository would
          # deadlock; docs/decisions.md, 2026-11-07) — including its tier handling: a low or medium pull
          # request needs no approval. The pull request's copy of the script is never executed; in this
          # situation the tier is forced to high.
          case "$TIER" in
            low | medium)
              echo "risk gate (bootstrap): $TIER risk needs no maintainer approval"
              exit 0
              ;;
            high) ;;
            *)
              echo "risk gate: '$TIER' is not a risk tier" >&2
              exit 2
              ;;
          esac
          # The author association comes from the API, never from this file: the YAML of a `pull_request`
          # run is the pull request's own, so an input it could set would be a self-approval.
          if ! author_association=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.author_association'); then
            echo "::error::risk gate: could not read pull request #$PR_NUMBER"
            exit 2
          fi
          if [ "$author_association" = OWNER ]; then
            echo "risk gate (bootstrap): the pull request author is the owner of $REPO; no review required"
            exit 0
          fi
          # `gh api --paginate --jq` applies the filter to each page and prints one result per page, so the
          # pages are fetched whole and reduced once. A multi-page review history must not read as "no
          # approval" (or break the numeric test with "1\n0").
          pages="$RUNNER_TEMP/reviews.json"
          if ! gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" >"$pages"; then
            echo '::error::risk gate: could not read the reviews of this pull request'
            exit 2
          fi
          if ! approved=$(jq -s 'add // []' "$pages" | jq --arg head "$HEAD_SHA" '
                [.[] | select(.state | IN("APPROVED","CHANGES_REQUESTED","DISMISSED"))]
                | group_by(.user.login)
                | map(max_by(.submitted_at))
                | map(select(.state == "APPROVED"
                    and .commit_id == $head
                    and (.author_association | IN("OWNER","MEMBER","COLLABORATOR"))))
                | length'); then
            echo '::error::risk gate: the review list is not JSON'
            exit 2
          fi
          if [ "${approved:-0}" -gt 0 ]; then
            echo "risk gate (bootstrap): an approval of $HEAD_SHA exists"
            exit 0
          fi
          echo "::error::high-risk pull request: it needs an approval from the maintainer of the current revision ($HEAD_SHA). Approve the pull request, then re-run the failed jobs with: gh run rerun --failed <run-id>"
          exit 1
          # --- end bootstrap gate rule ---

      - name: Arm auto-merge for a low-risk pull request
        if: steps.tier.outputs.tier == 'low'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Auto-merge waits for the required checks (`ci` and `security`) by itself. It needs the
          # repository setting allow_auto_merge, which is a maintainer decision; until it is on, the call
          # fails and the pull request simply does not merge by itself, as today.
          #
          # The failure is reported as it came, not as a guess about its cause: a read-only token and an
          # API error look different and both need the maintainer's eyes.
          if output=$(gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --auto 2>&1); then
            echo 'auto-merge armed: merges in squash when the required checks are green'
            echo 'Auto-merge armed.' >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::auto-merge not armed: $output"
            {
              echo
              echo '**Auto-merge not armed** (the pull request is still mergeable by hand once the checks are green):'
              echo
              echo '```'
              printf '%s\n' "$output"
              echo '```'
              echo
              echo 'If the cause is the repository setting, the maintainer enables it with:'
              echo '`gh api --method PATCH repos/'"$REPO"' -F allow_auto_merge=true`.'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

  # Single required check with a stable name: adding or renaming an internal job does not touch the
  # ruleset. A skipped PR-only job is not a failure, so `push` to main can pass without them.
  ci:
    name: ci
    needs: [typescript, rust, rust-tauri, governance, risk, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only for scripts/ci-aggregate.sh, which is where the rule lives. It is a script, not YAML inline,
      # because tests/shell/ci-aggregate.test.sh exercises every combination of results locally.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the base branch for the trusted aggregator
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --depth=1 --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Fail when a required job did not pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Passed as data, not interpolated into the script: a skipped job is only acceptable when the
          # reason is "this job does not run for this event", which is what PR_ONLY lists.
          EVENT: ${{ github.event_name }}
          # Jobs that only run for a pull request: `skipped` is expected outside one, and a bug inside
          # one. On a pull request every name here must also be present in `needs`, so dropping the gate
          # from the list cannot silently disable it.
          PR_ONLY: "governance,risk"
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The aggregator decides whether the required check is green, so it must not come from the pull
          # request: a change to scripts/ci-aggregate.sh would otherwise pass itself. It is read from the
          # base revision; when the base has no copy (the pull request that introduces it) the rule below
          # runs instead — fixed in this file, never the pull request's script.
          script=scripts/ci-aggregate.sh
          if [ "$EVENT" = pull_request ]; then
            # Same check as the risk job: a regular, non-empty blob from the base revision, never the pull
            # request's copy. `git show` of an empty blob succeeds and `sh` on an empty file exits 0, which
            # would make the required check green without looking at `needs`.
            entry=$(git ls-tree "origin/$BASE_REF" -- "$script" 2>/dev/null) || entry=
            mode=$(printf '%s' "$entry" | awk '{print $1}')
            size=$(git cat-file -s "origin/$BASE_REF:$script" 2>/dev/null) || size=0
            case "$mode" in
              100644 | 100755) usable=1 ;;
              *) usable=0 ;;
            esac
            if [ "$usable" = 1 ] && [ "${size:-0}" -gt 0 ] &&
              git show "origin/$BASE_REF:$script" >"$RUNNER_TEMP/aggregate.sh" 2>/dev/null &&
              [ -s "$RUNNER_TEMP/aggregate.sh" ]; then
              script=$RUNNER_TEMP/aggregate.sh
            else
              # The name is spelled out: `$script` is cleared below, and a message that reads "has no ;" is
              # worse than no message.
              echo "::warning::origin/$BASE_REF has no usable scripts/ci-aggregate.sh; using the fixed bootstrap rule in the workflow file"
              script=
            fi
          fi
          if [ -n "$script" ]; then
            sh "$script"
            exit $?
          fi
          # --- bootstrap aggregate rule (tested by tests/shell/ci-workflow-bootstrap.test.sh) ---
          # Bootstrap rule: the same contract as scripts/ci-aggregate.sh (which is the source of truth once
          # it is on main) — no empty `needs`, every PR-only job present on a pull request, and no job that
          # is not `success` unless it is PR-only and skipped outside a pull request.
          if [ "$(printf '%s' "$NEEDS" | jq 'length')" -eq 0 ]; then
            echo 'aggregate: NEEDS is empty; the aggregator waits for nothing' >&2
            exit 2
          fi
          missing=$(printf '%s' "$NEEDS" | jq -r --arg event "$EVENT" --arg pr_only "$PR_ONLY" '
            if $event == "pull_request" then
              ($pr_only | split(",") | map(select(. != ""))) as $pr_only
              | (keys) as $present
              | $pr_only[] as $name
              | select(($present | index($name)) | not)
              | $name
            else empty end')
          if [ -n "$missing" ]; then
            printf 'required jobs missing from needs (they run for every pull request):\n%s\n' "$missing" >&2
            exit 1
          fi
          failed=$(printf '%s' "$NEEDS" | jq -r --arg event "$EVENT" --arg pr_only "$PR_ONLY" '
            ($pr_only | split(",") | map(select(. != ""))) as $pr_only
            | to_entries[]
            | select(.value.result != "success"
                and ((.key as $key | $pr_only | index($key) | not)
                  or (.value.result != "skipped")
                  or ($event == "pull_request")))
            | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            printf 'required jobs did not pass:\n%s\n' "$failed" >&2
            exit 1
          fi
          echo "aggregate: every required job passed ($EVENT)"
          # --- end bootstrap aggregate rule ---
