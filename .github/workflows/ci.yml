name: ci

# What runs on every pull request to main. The app targets macOS arm64, so the Rust job runs on
# macos-15; the TypeScript job needs no macOS and runs on ubuntu to keep the queue short.
#
# The name of the `ci` job is a contract with .github/rulesets/main.json: renaming it (or removing the
# job) without updating the ruleset silently removes the required check.
on:
  pull_request:
    branches: [main]
    # `edited` so a fixed PR title is re-linted; the default types do not include it.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  # Lets a branch exercise this workflow before it becomes a required check.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript (tsc + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test:unit

  rust:
    name: Rust (fmt, clippy, host tests)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # The fixture output is parsed in English; a translated runner would break the assertions.
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The channel, rustfmt and clippy come from rust-toolchain.toml: no toolchain action to pin and
      # no second place where the Rust version lives. The runner image already ships rustup.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          # src-tauri is a separate workspace; it formats with its own manifest.
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # src-tauri is left out on purpose: it builds the whole Tauri stack and no PR here changes it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The fixtures pin SDK 8.0.408 in their global.json with rollForward: disable, and the runner
      # image does not ship that exact version.
      - name: Set up the fixture .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.408"

      - name: Host tests
        run: cargo test -p openridr-host

  # Single required check with a stable name: adding or renaming an internal job does not touch the
  # ruleset. A skipped PR-only job is not a failure, so `push` to main can pass without them.
  ci:
    name: ci
    needs: [typescript, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a required job did not pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            printf 'required jobs did not pass:\n%s\n' "$failed" >&2
            exit 1
          fi
