name: dependency-audit

# Weekly, and out of the pull request path on purpose: an advisory published today must not stop
# tomorrow's pull request. gitleaks looks for secrets and Dependabot proposes a bump; neither answers
# "does this lockfile have a published advisory", which is what this workflow does for the three
# lockfiles — bun.lock, the root Cargo.lock and src-tauri/Cargo.lock (separate workspace, separate
# lockfile).
#
# It is not in the `needs` of the `ci` aggregator and not in PR_ONLY: it can never block a merge, and
# the required checks in .github/rulesets/main.json do not change.
on:
  schedule:
    # 04:10 UTC on Monday: after the nightly E2E smoke, before the European morning.
    - cron: "10 4 * * 1"
  workflow_dispatch:
  pull_request:
    # `schedule` and `workflow_dispatch` only run from the default branch, so without this trigger the
    # pull request that introduces this file could not prove it. The path filter keeps the cost at
    # zero for a normal pull request and audits a new dependency in the pull request that adds it.
    paths:
      - "bun.lock"
      - "Cargo.lock"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      # Any vulnerability of any severity fails the job: `bun audit` exits 1 when it finds one and,
      # by design, also when the request itself fails ("audit request failed"). A scanner that could
      # not run must never read as "clean", so there is no `continue-on-error` and no `|| true` here.
      # It reads bun.lock and the registry, so it needs no `bun install`.
      - name: Audit bun.lock
        run: bun audit

      # Prebuilt binary with the checksum of the tarball recorded here: no `cargo install` compile,
      # no new third-party action, and the version cannot drift. The checksum is for
      # cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz, the static build that runs on any Linux
      # runner. Installed under $RUNNER_TEMP so nothing here depends on the image's Rust setup.
      - name: Install cargo-audit 0.22.2
        env:
          SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          tarball=cargo-audit-x86_64-unknown-linux-musl-v0.22.2
          curl -fsSL "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/$tarball.tgz" \
            -o "$RUNNER_TEMP/$tarball.tgz"
          echo "$SHA256  $RUNNER_TEMP/$tarball.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball.tgz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/$tarball/cargo-audit" "$RUNNER_TEMP/bin/cargo-audit"
          "$RUNNER_TEMP/bin/cargo-audit" --version
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      # Called as `cargo-audit audit`, not `cargo audit`: `cargo` is a rustup shim, and inside this
      # repository rust-toolchain.toml would make it try to install the pinned 1.99.0 toolchain for a
      # tool that compiles nothing. The binary needs no Rust toolchain, only the lockfile and the
      # advisory database — which it fetches on every run, because the runner is clean. There is no
      # cache of the advisory database: a fetch that fails is a red job, not a stale green one.
      #
      # A vulnerability of any severity exits 1. Unmaintained/unsound/informational warnings are
      # printed and exit 0 (baseline today: 1 in the root, 6 in src-tauri — unmaintained crates plus
      # one unsound `glib` API, most of them pulled in by the Linux GTK stack) — turning a warning
      # into a gate would make this job born red.
      #
      # An exception is an `--ignore` on the line that needs it, with the reason and the review date
      # on the same line, e.g.
      #   cargo-audit audit --file Cargo.lock --ignore RUSTSEC-0000-0000 # <reason>, review by 2027-01-01
      # Nothing executes that date: the weekly run and a human reading it are the reminder. Declared
      # limitation, not a promise.
      - name: Audit the root Cargo.lock
        run: cargo-audit audit --file Cargo.lock

      - name: Audit the src-tauri Cargo.lock
        run: cargo-audit audit --file src-tauri/Cargo.lock
