[package]
name = "openridr-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenRidr host: workspace state, text outline and gated dispatch"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
