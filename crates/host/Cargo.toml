[package]
name = "openridr-host"
version = "0.3.0-alpha.4"
edition = "2021"
license = "Apache-2.0"
description = "OpenRidr host: workspace state, text outline and gated dispatch"

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
